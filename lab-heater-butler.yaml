# https://lastminuteengineers.com/esp32-wroom-32-pinout-reference/
# https://nachbelichtet.com/en/measure-water-level-in-cisterns-and-tanks-with-homeassistant-esphome-and-tl-136-pressure-sensor-update-2
# https://gitlab.com/mrjones.id.au/bluetoothheater/-/blob/master/Documentation/V9%20-%20Hacking%20the%20Chinese%20Diesel%20Heater%20Communications%20Protocol.pdf?ref_type=heads

esphome:
  name: lab-heater
  friendly_name: lab-heater
  name_add_mac_suffix: false
  

esp32:
  board: nodemcu-32s
  variant: ESP32
  framework:
    type: esp-idf
    advanced: 
      minimum_chip_revision: "3.1"
    
external_components:
  - source:
      type: local
      path: components
    components: [ heater_uart ]

  # - source:
  #     type: git
  #     url: https://github.com/tekh/cdh-esphome
  #     ref: main

# Enable logging
logger:
  level: INFO #INFO #DEBUG #VERY_VERBOSE

web_server:
  port: 80
  version: 3
  ota: false
  sorting_groups:
    - id: sorting_group_controls
      name: "Controls"
      sorting_weight: 10
    - id: sorting_group_sensors
      name: "Sensors"
      sorting_weight: 20
uart:
  rx_pin:
    number: GPIO16
    # Vevor bus = inverted logic (needs `inverted: true` here AND on tx_pin IF your
    # interface uses the reference transistor circuit; try without first on the
    # direct 1k-ohm tap used for the 8kW)
  tx_pin:
    number: GPIO17
  id: uart_bus
  data_bits: 8
  parity: NONE
  stop_bits: 1
  baud_rate: 4800  # Vevor (vevor_2kw) = 4800 baud | BDAP (jeabong_8kw) = 25000
  rx_buffer_size: 512

  # UART sniffing (debug) - logs raw bytes both directions
  debug:
    direction: BOTH
    dummy_receiver: false
    after:
      bytes: 48
    sequence:
      - lambda: UARTDebug::log_hex(direction, bytes, ' ');

####################
# Heater UART component with climate control
heater_uart:
    update_interval: 5s
    id: heater
    # vevor_2kw_v2 = 2kW Vevor, EXPERIMENTAL: in HEAT mode the firmware sends the
    # level you set verbatim (no approach control, no HX-soot pump override).
    # REVERT (one line, then reflash): 'vevor_2kw' = v1 2kW (firmware modulates
    # HEAT), 'jeabong_8kw' = the 8kW BDAP heater (real pump-Hz + fan control).
    heater_model: vevor_2kw_v2
    operating_voltage: 12V  # or 24V depending on your heater
    temperature_sensor: dht22_temperature  # DHT22 for room temperature in standalone mode
    temperature_backoff: 0.5  # Start ramping down pump this many °C before target
    altitude: 762  # metres above sea level (0-5000) - confirmed real altitude; Vevor TX derates fuel by sigma(h), BDAP sends this in-frame
    auto_shutdown_overshoot: 0.0   # Trigger when room > target (setpoint) at min pump. 2026-10-20: 0.5 -> 0.0 per spec (shut off once past the set temperature; with 0.5 the heater idled at min level indefinitely when the room's min-output equilibrium sat below target+0.5). Code checks pump <= pump_freq_min+0.05, not 1.3Hz.
    auto_shutdown_hysteresis: 1.0  # Restart when room < target - 1.0°C (re-engage offset chosen 2026-10-20; was 1.5)
    approach_threshold: 1.0        # Start reducing pump when within 1°C of target (gentler approach)
    ambient_heat_limit: 26.0       # HEAT mode not AUTO safety limit - force shutdown if room > 26°C (range: -40 to 80°C)

select:
  - platform: heater_uart
    name: "Heater Mode"
    id: heater_mode
    heater_uart_id: heater
    web_server:
      sorting_group_id: sorting_group_controls

sensor:
  # DHT22 Temperature/Humidity Sensor (for standalone mode room temperature)
  - platform: dht
    pin: GPIO21
    model: DHT22
    update_interval: 10s
    temperature:
      name: "Room Temperature"
      id: dht22_temperature
      web_server:
        sorting_group_id: sorting_group_sensors
    humidity:
      name: "Room Humidity"
      id: dht22_humidity
      web_server:
        sorting_group_id: sorting_group_sensors

  - platform: heater_uart
    current_temperature:
      name: "Current Temperature"
      web_server:
        sorting_group_id: sorting_group_sensors
    fan_speed:
      name: "Fan Speed"
      web_server:
        sorting_group_id: sorting_group_sensors
    supply_voltage:
      name: "Supply Voltage"
      web_server:
        sorting_group_id: sorting_group_sensors
    heat_exchanger_temp:
      name: "Heat Exchanger Temperature"
      web_server:
        sorting_group_id: sorting_group_sensors
    glow_plug_voltage:
      name: "Glow Plug Voltage"
      web_server:
        sorting_group_id: sorting_group_sensors
    glow_plug_current:
      name: "Glow Plug Current"
      web_server:
        sorting_group_id: sorting_group_sensors
    pump_frequency:
      name: "Pump Frequency"
      web_server:
        sorting_group_id: sorting_group_sensors
    fan_voltage:
      name: "Fan Voltage"
      web_server:
        sorting_group_id: sorting_group_sensors
    # Raw glow-cluster bytes - non-zero only while the glow is lit. Quantity
    # unidentified (voltage? temperature?), so published raw and unit-less.
    glow_a:
      name: "Glow A (unverified)"
      web_server:
        sorting_group_id: sorting_group_sensors
    glow_b:
      name: "Glow B (unverified)"
      web_server:
        sorting_group_id: sorting_group_sensors
    glow_c:
      name: "Glow C (unverified)"
      web_server:
        sorting_group_id: sorting_group_sensors
    # What the heater reports it is running at, vs the Power Level dial (your
    # request). Watch this to see the HEAT start-at-max then ramp down.
    power_level_actual:
      name: "Power Level Actual"
      web_server:
        sorting_group_id: sorting_group_sensors
    desired_temperature:
      name: "Desired Temperature"
      web_server:
        sorting_group_id: sorting_group_sensors

number:
  - platform: heater_uart
    type: temperature
    name: "Target Temperature"
    id: heater_temperature
    heater_uart_id: heater
    min_value: 0
    max_value: 30
    step: 0.5
    mode: slider
    unit_of_measurement: "°C"
    icon: "mdi:thermometer"
    web_server:
      sorting_group_id: sorting_group_controls

  # THE fuel dial for this heater (Vevor 2kW = level-commanded hardware).
  # Levels 1-10; 1 is the minimum burn (ECM runs it at pump ~1.6 Hz / fan
  # ~3200 RPM - the protocol floor). In HEAT mode the firmware sends this
  # level verbatim. There is deliberately NO pump-frequency dial here and no
  # fan dial: the Vevor protocol has no such commands (the fan-probe
  # experiment on undocumented TX bytes was proven ignored - see
  # @notes/vevor-protocol.md).
  #
  # The pump-frequency dial belongs to the 8kW BDAP device (has_pump_hz_control
  # profile flag) - declare it there, not here. This dial refuses writes on
  # hardware that has no power-level command, so the two can never both be live.
  - platform: heater_uart
    type: power_level
    name: "Power Level"
    id: heater_power_level
    heater_uart_id: heater
    min_value: 1
    max_value: 10
    step: 1
    mode: slider
    icon: "mdi:speedometer"
    web_server:
      sorting_group_id: sorting_group_controls

text_sensor:
  - platform: heater_uart
    run_state:
      name: "Run State"
      web_server:
        sorting_group_id: sorting_group_sensors
    error_code:
      name: "Error Code"
      web_server:
        sorting_group_id: sorting_group_sensors

binary_sensor:
  - platform: heater_uart
    on_off_state:
      id: on_off_state
      name: "On|Off State"
      web_server:
        sorting_group_id: sorting_group_sensors

    auto_shutdown_active:
      name: "Auto Shutdown Active"
      id: auto_shutdown_active
      web_server:
        sorting_group_id: sorting_group_sensors

    standby_active:
      name: "Standby Active"
      id: standby_active
      web_server:
        sorting_group_id: sorting_group_sensors

    priming_active:
      name: "Priming Active"
      id: priming_active
      web_server:
        sorting_group_id: sorting_group_sensors

button:
  - platform: heater_uart
    name: "Fuel Prime"
    id: fuel_prime_button
    heater_uart_id: heater
    icon: "mdi:fuel"
    web_server:
      sorting_group_id: sorting_group_controls

# Enable Home Assistant API
api:
  encryption:
    key: !secret lab_heater__encryption_key
  reboot_timeout: 0s

# Allow Over-The-Air updates
ota:
- platform: esphome
  encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: !secret lab_heater__use_address

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "lab-heater Fallback Hotspot"
    password: !secret wifi_password

captive_portal:
