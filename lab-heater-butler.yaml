# https://lastminuteengineers.com/esp32-wroom-32-pinout-reference/
# https://nachbelichtet.com/en/measure-water-level-in-cisterns-and-tanks-with-homeassistant-esphome-and-tl-136-pressure-sensor-update-2
# https://gitlab.com/mrjones.id.au/bluetoothheater/-/blob/master/Documentation/V9%20-%20Hacking%20the%20Chinese%20Diesel%20Heater%20Communications%20Protocol.pdf?ref_type=heads

esphome:
  name: lab-heater
  friendly_name: lab-heater
  name_add_mac_suffix: false

esp32:
  board: nodemcu-32s
  variant: ESP32
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components: [ heater_uart ]

  # - source:
  #     type: git
  #     url: https://github.com/daoudeddy/cdh-esphome
  #     ref: main

# Enable logging
logger:
  level: INFO #DEBUG #VERY_VERBOSE

web_server:
  port: 80
  version: 3
  ota: false
  sorting_groups:
    - id: sorting_group_controls
      name: "Controls"
      sorting_weight: 10
    - id: sorting_group_sensors
      name: "Sensors"
      sorting_weight: 20
uart:
  rx_pin:
    number: GPIO16
  tx_pin:
    number: GPIO17
  id: uart_bus
  data_bits: 8
  parity: NONE
  stop_bits: 1
  baud_rate: 25000
  rx_buffer_size: 512

#  debug:
#    direction: BOTH
#    dummy_receiver: false
#    after:
#     bytes: 48
#    sequence:
#     - lambda: UARTDebug::log_hex(direction, bytes, ' ');

####################
# Heater UART component with on/off only
#heater_uart:
#  update_interval: 5s
#  id: heater

####################
# Heater UART component with climate control
heater_uart:
    update_interval: 5s
    id: heater
    standalone_mode: true
    operating_voltage: 12V  # or 24V depending on your heater
    temperature_sensor: dht22_temperature  # DHT22 for room temperature in standalone mode
    temperature_backoff: 0.5  # Start ramping down pump this many °C before target
    altitude: 750  # metres above sea level (0-5000)
    auto_shutdown_overshoot: 0.5   # Trigger when room > target + 0.5°C at min pump AND pump has reached 1.3hz
    auto_shutdown_hysteresis: 1.5  # Restart when room < target - 1.5°C
    approach_threshold: 1.0        # Start reducing pump when within 1°C of target (gentler approach)
    ambient_heat_limit: 26.0       # HEAT mode not AUTO safety limit - force shutdown if room > 26°C (range: -40 to 80°C)

select:
  - platform: heater_uart
    name: "Heater Mode"
    id: heater_mode
    heater_uart_id: heater
    web_server:
      sorting_group_id: sorting_group_controls

sensor:
  # DHT22 Temperature/Humidity Sensor (for standalone mode room temperature)
  - platform: dht
    pin: GPIO21
    model: DHT22
    update_interval: 10s
    temperature:
      name: "Room Temperature"
      id: dht22_temperature
      web_server:
        sorting_group_id: sorting_group_sensors
    humidity:
      name: "Room Humidity"
      id: dht22_humidity
      web_server:
        sorting_group_id: sorting_group_sensors

  - platform: heater_uart
    current_temperature:
      name: "Current Temperature"
      web_server:
        sorting_group_id: sorting_group_sensors
    fan_speed:
      name: "Fan Speed"
      web_server:
        sorting_group_id: sorting_group_sensors
    supply_voltage:
      name: "Supply Voltage"
      web_server:
        sorting_group_id: sorting_group_sensors
    heat_exchanger_temp:
      name: "Heat Exchanger Temperature"
      web_server:
        sorting_group_id: sorting_group_sensors
    glow_plug_voltage:
      name: "Glow Plug Voltage"
      web_server:
        sorting_group_id: sorting_group_sensors
    glow_plug_current:
      name: "Glow Plug Current"
      web_server:
        sorting_group_id: sorting_group_sensors
    pump_frequency:
      name: "Pump Frequency"
      web_server:
        sorting_group_id: sorting_group_sensors
    fan_voltage:
      name: "Fan Voltage"
      web_server:
        sorting_group_id: sorting_group_sensors
    desired_temperature:
      name: "Desired Temperature"
      web_server:
        sorting_group_id: sorting_group_sensors

number:
  - platform: heater_uart
    type: temperature
    name: "Target Temperature"
    id: heater_temperature
    heater_uart_id: heater
    min_value: 0
    max_value: 30
    step: 0.5
    mode: slider
    unit_of_measurement: "°C"
    icon: "mdi:thermometer"
    web_server:
      sorting_group_id: sorting_group_controls

  # Pump frequency is automatically controlled by the thermostat logic in standalone mode
  - platform: heater_uart
    type: pump
    name: "Pump Frequency Control"
    id: heater_pump_frequency
    heater_uart_id: heater
    min_value: 1.3
    max_value: 5.5
    step: 0.1
    unit_of_measurement: "Hz"
    icon: "mdi:fuel"
    web_server:
      sorting_group_id: sorting_group_controls

text_sensor:
  - platform: heater_uart
    run_state:
      name: "Run State"
      web_server:
        sorting_group_id: sorting_group_sensors
    error_code:
      name: "Error Code"
      web_server:
        sorting_group_id: sorting_group_sensors

binary_sensor:
  - platform: heater_uart
    on_off_state:
      id: on_off_state
      name: "On|Off State"
      web_server:
        sorting_group_id: sorting_group_sensors

    auto_shutdown_active:
      name: "Auto Shutdown Active"
      id: auto_shutdown_active
      web_server:
        sorting_group_id: sorting_group_sensors

    standby_active:
      name: "Standby Active"
      id: standby_active
      web_server:
        sorting_group_id: sorting_group_sensors

    priming_active:
      name: "Priming Active"
      id: priming_active
      web_server:
        sorting_group_id: sorting_group_sensors

button:
  - platform: heater_uart
    name: "Fuel Prime"
    id: fuel_prime_button
    heater_uart_id: heater
    icon: "mdi:fuel"
    web_server:
      sorting_group_id: sorting_group_controls

# Enable Home Assistant API
api:
  encryption:
    key: "iSC5KYuxKIP04Vv7Q669s/EYgBQgyVSiJOu3f7o/wNA="
  reboot_timeout: 0s

# Allow Over-The-Air updates
ota:
- platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: "lab-heater.iot.stmartin.one"

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "lab-heater Fallback Hotspot"
    password: !secret wifi_password

captive_portal:
